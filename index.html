<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Flying Paper Plane</title>\n    <style>\n        body {\n            margin: 0;\n            overflow-x: hidden;\n            height: 200vh;\n            background: linear-gradient(to bottom, #87CEFA, #ffffff);\n        }\n        .plane {\n            position: absolute;\n            width: 100px;\n            height: 60px;\n            background: url('https://example.com/paper-plane.png') no-repeat;\n            background-size: contain;\n        }\n    </style>\n</head>\n<body>\n    <div class="plane" id="plane"></div>\n    <script>\n        let plane = document.getElementById('plane');\n        let position = 0;\n        function flyPlane() {\n            position += 2;\n            if (position > window.innerWidth) {\n                position = -100;\n            }\n            plane.style.transform = 'translateX(' + position + 'px)';\n        }\n        setInterval(flyPlane, 50);\n    </script>\n</body>\n</html>
